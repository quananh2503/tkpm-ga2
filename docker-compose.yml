services:
  #master
  postgresql-master:
    image: bitnami/postgresql:latest
    container_name: postgres_master
    ports:
      - '5432:5432'
    volumes:
      - 'postgresql_master_data:/bitnami/postgresql'
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql 
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=my_password
      - POSTGRESQL_DATABASE=my_database
      - ALLOW_EMPTY_PASSWORD=yes
  #slave
  postgresql-slave:
    image: bitnami/postgresql:latest
    container_name: postgres_slave
    ports:
      - '5433:5432'
    depends_on:
      - postgresql-master
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=postgresql-master
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_PASSWORD=my_password
      - ALLOW_EMPTY_PASSWORD=yes
  #server1
  node_1:
    build: ./api
    container_name: golang_node_1
    environment:
      - NODE_ID=Node_1
      - DB_MASTER_HOST=postgresql-master
      - DB_SLAVE_HOST=postgresql-slave
      - DB_USER=postgres
      - DB_PASS=my_password
      - DB_NAME=my_database
    depends_on:
      - postgresql-master
      - postgresql-slave
  #sever2
  node_2:
    build: ./api
    container_name: golang_node_2
    environment:
      - NODE_ID=Node_2
      - DB_MASTER_HOST=postgresql-master
      - DB_SLAVE_HOST=postgresql-slave
      - DB_USER=postgres
      - DB_PASS=my_password
      - DB_NAME=my_database
    depends_on:
      - postgresql-master
      - postgresql-slave
  #Load balacne
  nginx:
    image: nginx:alpine
    container_name: nginx_load_balancer
    ports:
      - "80:80" 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node_1
      - node_2

volumes:
  postgresql_master_data:
    driver: local